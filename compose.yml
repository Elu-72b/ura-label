# 開発用の Docker Compose 設定
# 使い方: docker compose up → http://localhost:3100
services:
  db:
    # 本番(Render)の PostgreSQL とメジャーバージョンを揃える
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pg_data:/var/lib/postgresql/data
    # DBの準備完了を web 側が待てるようにヘルスチェックを設定
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # 前回の異常終了で残った PID ファイルを消す → DB準備 → CSSビルド → サーバー起動
    # (0.0.0.0 で待ち受けないとホストのブラウザから届かない)
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails db:prepare &&
               bin/rails tailwindcss:build &&
               bin/rails server -b 0.0.0.0 -p 3000"
    volumes:
      # ホストのコードをマウントし、変更をすぐ反映させる
      - .:/app
      # gem を名前付きボリュームに置き、bundle install の結果をコンテナ再作成後も残す
      - bundle:/usr/local/bundle
    # ホスト側3100 → コンテナ3000(他のプロジェクトの3000番と競合しないように)
    ports:
      - "3100:3000"
    environment:
      # config/database.yml がこの値を読んで db コンテナに接続する
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
    # OPENAI_API_KEY などの秘密情報は .env から読み込む(.env はコミットしない)
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Tailwind CSS の変更を監視して自動ビルドする(web とは別プロセス)
  css:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails tailwindcss:watch
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    # 疑似TTYを割り当てないと watch がすぐ終了するため付与
    tty: true
    stdin_open: true
    depends_on:
      - web

volumes:
  pg_data:
  bundle:
